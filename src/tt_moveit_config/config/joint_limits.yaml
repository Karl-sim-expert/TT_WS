  panda_joint1: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 10.0}
  panda_joint2: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 10.0}
  panda_joint3: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 10.0}
  panda_joint4: {has_velocity_limits: true, max_velocity: 2.3925, has_acceleration_limits: true, max_acceleration: 10.0}
  panda_joint5: {has_velocity_limits: true, max_velocity: 2.871, has_acceleration_limits: true, max_acceleration: 15.0}
  panda_joint6: {has_velocity_limits: true, max_velocity: 2.871, has_acceleration_limits: true, max_acceleration: 15.0}
