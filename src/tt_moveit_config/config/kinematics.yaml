# KDL ships with MoveIt. For a faster / more robust solver install ros-humble-trac-ik-kinematics-plugin
# and use  kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
panda_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
